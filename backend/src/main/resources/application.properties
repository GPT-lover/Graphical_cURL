# ---------------------------------------------------------------------------
# Core
# ---------------------------------------------------------------------------
spring.application.name=curl-gui-backend
server.port=8080

# ---------------------------------------------------------------------------
# Outbound HTTP is performed by running the real `curl` executable (see
# CurlProcessExecutor) - not Java's HttpClient - so requests match what CLI curl
# sends. By default the app runs `curl.exe` on Windows and `curl` elsewhere,
# resolved via PATH (Windows 10/11 ship curl.exe with the OS). Set this only if
# curl is not on PATH or you need a specific build:
#   app.curl.path=C:/Program Files/curl/bin/curl.exe
# app.curl.path=

# ---------------------------------------------------------------------------
# SQLite - an embedded, file-based database. No separate server process.
# The file is created on first run at   backend/data/app.db
# (path is relative to the working directory you launch the app from).
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:sqlite:data/app.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite allows only one writer at a time. A single pooled connection serialises
# access and avoids "database is locked" errors for this local single-user app.
spring.datasource.hikari.maximum-pool-size=1

# Hibernate needs to be told which SQL dialect to speak. SQLite's dialect ships
# in the hibernate-community-dialects dependency.
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# "update": Hibernate creates/updates tables to match @Entity classes on startup
# (the request_history table since Phase 7). Convenient while learning; a real
# project would use versioned migrations instead.
spring.jpa.hibernate.ddl-auto=update

# Disable "open session in view" - it's a common source of confusion and we
# don't need it. Queries happen inside @Service methods instead.
spring.jpa.open-in-view=false

# Log the SQL Hibernate runs - handy while learning. Set to false if it's noisy.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
