# ---------------------------------------------------------------------------
# "desktop" profile - activated by the Electron shell with
#   --spring.profiles.active=desktop
#
# It only changes operational noise. The two values that actually matter for the
# packaged app - the HTTP port and the SQLite file location - are passed by
# Electron as command-line arguments at launch, because both are decided at
# runtime:
#
#   --server.port=<free port chosen by Electron>
#   --spring.datasource.url=jdbc:sqlite:<user-data dir>/graphical-curl.db
#
# Plain browser development does NOT use this profile, so `npm run dev` /
# `gradlew.bat bootRun` behaviour is unchanged.
# ---------------------------------------------------------------------------

# The desktop app has no dev console to read a firehose of SQL. Keeping the
# echo off also guarantees bound statement parameters never reach the log file
# Electron tees the backend output into.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.orm.jdbc.bind=warn

# Trim startup output; the shell logs its own lifecycle lines.
spring.main.banner-mode=off
logging.level.org.springframework.boot.web.embedded.tomcat=info

# Bind to loopback only - the desktop backend must never be reachable from the
# network. (Redundant with Electron passing --server.address, belt and braces.)
server.address=127.0.0.1
