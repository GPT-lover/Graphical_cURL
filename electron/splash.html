<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline';"
    />
    <title>Starting Graphical cURL</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: #1e1e2e;
        color: #cdd6f4;
        overflow: hidden;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .title {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      .sub {
        font-size: 12px;
        color: #9399b2;
      }
      .bar {
        width: 180px;
        height: 4px;
        border-radius: 2px;
        background: #313244;
        overflow: hidden;
        position: relative;
      }
      .bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 2px;
        background: #89b4fa;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          left: -40%;
        }
        100% {
          left: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="title">Graphical cURL</div>
      <div class="bar" role="progressbar" aria-label="Starting"></div>
      <div class="sub">Starting the backend&hellip;</div>
    </div>
  </body>
</html>
