# electron-builder configuration.
#
#   Windows x64  -> NSIS installer   (Graphical-cURL-Setup-<version>.exe)
#   macOS x64    -> DMG              (Graphical-cURL-<version>-x64.dmg)
#   macOS arm64  -> DMG              (Graphical-cURL-<version>-arm64.dmg)
#
# The macOS builds are UNSIGNED for now (no Apple Developer ID configured). See
# .github/workflows/release.yml and the README for what signing/notarization
# would add. Linux is still intentionally omitted.
#
# The bundled Java runtime (backend/build/jre) is produced by
# electron/scripts/build-jre.mjs with `jlink` and is PLATFORM-SPECIFIC: it must
# be regenerated on each target OS/arch. The release workflow does exactly that -
# one runner per OS/arch, each running `build:jre` natively before packaging.

appId: com.example.graphicalcurl
productName: Graphical cURL
copyright: Copyright (c) 2026 Graphical cURL

directories:
  output: release
  buildResources: electron/resources

# What goes INSIDE the app (app.asar). Only the Electron shell itself - the
# heavy artifacts (Spring Boot jar, bundled Java runtime, built frontend) are
# shipped as `extraResources` below so they stay real files on disk.
files:
  - electron/**/*
  - "!electron/scripts/**"
  - package.json

# Copied verbatim into  <install dir>/resources/ .  Resolved at runtime via
# process.resourcesPath (see electron/main.js).
extraResources:
  # The executable Spring Boot jar. `-plain.jar` is the library jar without an
  # embedded server - exclude it.
  - from: backend/build/libs
    to: backend
    filter:
      - "*.jar"
      - "!*-plain.jar"
  # A minimal Java runtime produced by jlink (electron/scripts/build-jre.mjs).
  # This is why the end user does NOT need Java installed.
  - from: backend/build/jre
    to: jre
  # The production React build (vite build -> frontend/dist).
  - from: frontend/dist
    to: ui

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  # Drop a 256x256 icon here and uncomment to brand the app + installer.
  # icon: electron/resources/icon.ico

nsis:
  oneClick: false
  perMachine: false          # per-user install: no admin prompt, clean uninstall
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Graphical cURL
  runAfterFinish: true
  artifactName: Graphical-cURL-Setup-${version}.${ext}

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  # No Apple Developer ID yet -> build an UNSIGNED .app. This makes the build
  # succeed on CI without any secrets. Downloaded copies will need a one-time
  # Gatekeeper override on the end user's Mac (documented in the README).
  identity: null
  hardenedRuntime: false
  # Graphical cURL-1.0.0.dmg -> Graphical-cURL-1.0.0-<arch>.dmg
  artifactName: Graphical-cURL-${version}-${arch}.${ext}

dmg:
  artifactName: Graphical-cURL-${version}-${arch}.${ext}
  # Do not try to codesign the .dmg either (no identity available).
  sign: false
